<svg x="20" y="62" width="700" height="285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Membrane flow schematic" viewBox="0 0 700 285" style="font-family:system-ui,-apple-system,Segoe UI,sans-serif"><title>Membrane flow schematic — Synthetic Case</title><rect width="700" height="285" fill="#fbfdfd"/><defs><marker id="m-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#547b80"/></marker></defs><text x="20" y="26" font-size="16" fill="#203e47" font-weight="700">Membrane module · conceptual flow</text><rect x="157" y="70" width="380" height="64" rx="12" fill="#e4f3f3" stroke="#b9d8d9"/><rect x="157" y="151" width="380" height="64" rx="12" fill="#eef4f6" stroke="#c9dadd"/><path d="M157 142H537" stroke="#1d727c" stroke-width="5" stroke-dasharray="9 4"/><text x="175" y="94" font-size="13" fill="#203e47" font-weight="700">Feed side</text><text x="175" y="115" font-size="12" fill="#667e84" >CO₂ / N₂</text><text x="175" y="175" font-size="13" fill="#203e47" font-weight="700">Permeate side</text><text x="175" y="199" font-size="11" fill="#667e84" >Dry GC composition includes sweep, if present</text><line x1="28" y1="102" x2="151" y2="102" stroke="#547b80" stroke-width="3" marker-end="url(#m-arrow)"/><line x1="541" y1="102" x2="673" y2="102" stroke="#547b80" stroke-width="3" marker-end="url(#m-arrow)"/><line x1="541" y1="183" x2="673" y2="183" stroke="#547b80" stroke-width="3" marker-end="url(#m-arrow)"/><line x1="28" y1="183" x2="151" y2="183" stroke="#547b80" stroke-width="3" marker-end="url(#m-arrow)"/><line x1="347" y1="113" x2="347" y2="166" stroke="#167f91" stroke-width="2.5" marker-end="url(#m-arrow)"/><text x="24" y="59" font-size="12" fill="#203e47" font-weight="700">Feed</text><text x="24" y="75" font-size="11" fill="#667e84" >1.65 bar abs</text><text x="545" y="59" font-size="12" fill="#203e47" font-weight="700">Retentate</text><text x="545" y="75" font-size="11" fill="#667e84" >1.63 bar abs</